name: Publicar Angular en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: paginaRestaurante/package-lock.json

      - name: Instalar dependencias
        working-directory: paginaRestaurante
        run: npm install --legacy-peer-deps

      - name: Generar la web
        working-directory: paginaRestaurante
        run: npm run build -- --base-href /elPeruanoJofemar/

      - name: Preparar los archivos publicados
        working-directory: paginaRestaurante
        run: |
          mkdir pages-artifact
          output_dir="$(dirname "$(find dist -type f -name index.html -print -quit)")"
          cp -a "$output_dir"/. pages-artifact/

      - name: Subir la web a GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: paginaRestaurante/pages-artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
