<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>El Peruano Jofemar</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="https://www.consuladoperugalicia.org/wp-content/uploads/2023/05/marcaoficial.png">
  <link rel="apple-touch-icon" href="https://www.consuladoperugalicia.org/wp-content/uploads/2023/05/marcaoficial.png">
  <meta name="theme-color" content="#d52b1e">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
  <script>
    (() => {
      const src = 'https://cdn.trustindex.io/loader.js?df946b3821b0019aa1667b76226';
      const moveWidget = () => {
        const widget = document.querySelector('body > .ti-widget');
        const target = document.querySelector('.trustindex-widget');
        if (widget && target && widget.parentElement !== target) target.appendChild(widget);
      };
      const observer = new MutationObserver(moveWidget);
      observer.observe(document.body, { childList: true, subtree: true });
      const script = document.createElement('script');
      script.src = src;
      script.defer = true;
      script.async = true;
      document.body.appendChild(script);
      moveWidget();
    })();
  </script>
<script>(()=>{const s=document.createElement('style');s.textContent='.review-ticker{display:grid;gap:18px;padding:8px 0}.review-ticker-row{overflow:hidden;padding:4px 0}.review-ticker-track{display:flex;width:max-content;gap:18px}.review-ticker-left{animation:rtl 70s linear infinite}.review-ticker-right{animation:ltr 70s linear infinite}.review-ticker-card{box-sizing:border-box;width:265px;min-height:158px;padding:18px;border:1px solid #eee;border-radius:12px;background:#fff;box-shadow:0 5px 18px rgba(0,0,0,.08);color:#333;font-family:Inter,Arial,sans-serif}.review-ticker-stars{display:block;color:#d52b1e;letter-spacing:2px;font-size:18px;margin-bottom:9px}.review-ticker-text{margin:0 0 14px;line-height:1.4;font-size:14px}.review-ticker-author{font-weight:700;font-size:13px}.review-ticker-date{color:#777;font-size:12px;margin-top:3px}@keyframes rtl{from{transform:translateX(0)}to{transform:translateX(-50%)}}@keyframes ltr{from{transform:translateX(-50%)}to{transform:translateX(0)}}.review-ticker-row:hover .review-ticker-track{animation-play-state:paused}@media(max-width:768px){.review-ticker-card{width:235px;min-height:150px;padding:15px}.review-ticker{gap:12px}.review-ticker-track{gap:12px}}';document.head.appendChild(s);const render=()=>{const target=document.querySelector('.trustindex-widget'),widget=target?.querySelector('.ti-widget');if(!target||!widget||target.querySelector('[data-review-ticker]'))return;const reviews=[...widget.querySelectorAll('.ti-review-item')].map(x=>({text:(x.querySelector('.ti-review-text')?.textContent||'').replace(/^\s*\+\d+\s*/,'').trim(),name:(x.querySelector('.ti-name')?.textContent||'Cliente de Google').trim(),date:(x.querySelector('.ti-date')?.textContent||'').trim(),rating:Math.round(Number(x.getAttribute('data-rating'))||5)})).filter(x=>x.text);if(reviews.length<8)return;widget.style.display='none';const ticker=document.createElement('div');ticker.dataset.reviewTicker='true';ticker.className='review-ticker';const row=(items,direction)=>{const wrap=document.createElement('div'),track=document.createElement('div');wrap.className='review-ticker-row';track.className='review-ticker-track review-ticker-'+direction;[...items,...items].forEach(v=>{const card=document.createElement('article'),stars=document.createElement('span'),text=document.createElement('p'),name=document.createElement('div'),date=document.createElement('div');card.className='review-ticker-card';stars.className='review-ticker-stars';stars.textContent='★★★★★'.slice(0,v.rating);text.className='review-ticker-text';text.textContent=v.text.length>170?v.text.slice(0,167)+'…':v.text;name.className='review-ticker-author';name.textContent=v.name;date.className='review-ticker-date';date.textContent=v.date;card.append(stars,text,name,date);track.appendChild(card)});wrap.appendChild(track);ticker.appendChild(wrap)};row(reviews.slice(0,8),'left');row(reviews.slice(-8).reverse(),'right');target.appendChild(ticker)};const o=new MutationObserver(render);o.observe(document.body,{childList:true,subtree:true});render();setTimeout(()=>o.disconnect(),30000)})();</script></body>
</html>
