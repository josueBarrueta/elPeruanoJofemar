<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>El Peruano Jofemar</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="https://www.consuladoperugalicia.org/wp-content/uploads/2023/05/marcaoficial.png">
  <link rel="apple-touch-icon" href="https://www.consuladoperugalicia.org/wp-content/uploads/2023/05/marcaoficial.png">
  <meta name="theme-color" content="#d52b1e">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
  <script>
    (() => {
      const src = 'https://cdn.trustindex.io/loader.js?df946b3821b0019aa1667b76226';
      const moveWidget = () => {
        const widget = document.querySelector('body > .ti-widget');
        const target = document.querySelector('.trustindex-widget');
        if (widget && target && widget.parentElement !== target) target.appendChild(widget);
      };
      const observer = new MutationObserver(moveWidget);
      observer.observe(document.body, { childList: true, subtree: true });
      const script = document.createElement('script');
      script.src = src;
      script.defer = true;
      script.async = true;
      document.body.appendChild(script);
      moveWidget();
    })();
  </script>
</body>
</html>
